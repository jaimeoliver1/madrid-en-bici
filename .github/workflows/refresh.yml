name: Monthly data refresh
on:
  schedule:
    - cron: "17 6 10 * *"   # 10th of each month, 06:17 UTC (EMT publishes the previous month by then)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - run: python3 pipeline/refresh.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data site; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git commit -m "Monthly data refresh $(date -u +%Y-%m)"
          git push
